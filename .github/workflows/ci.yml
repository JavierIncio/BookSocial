name: CI
#  Se dispara en cada push a main y en cada pull request. 
#  Usa el runner de GitHub (Ubuntu), instala JDK 21 Temurin con caché de dependencias Maven, y ejecuta el build del parent POM con el wrapper (así CI no depende de Maven instalado). 
#  Por ahora verify no compila nada de negocio porque aún no hay módulos: sirve para validar que el pipeline y el wrapper funcionan.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build backend with Maven wrapper
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify