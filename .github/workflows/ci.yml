name: CI
#  Se dispara en cada push a main y en cada pull request.
#  Usa el runner de GitHub (Ubuntu), instala JDK 21 Temurin con caché de dependencias Maven, y ejecuta el build del parent POM con el wrapper (así CI no depende de Maven instalado).
#  El contenedor de servicio PostgreSQL cubre la dependencia de identity-service (datasource booksocial/booksocial en localhost:5432).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booksocial
          POSTGRES_USER: booksocial
          POSTGRES_PASSWORD: booksocial
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booksocial -d booksocial"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: maven

      - name: Build backend with Maven wrapper
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
