spring:
  application:
    name: identity-service

  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booksocial}
    username: booksocial
    password: booksocial

  jpa:
    hibernate:
      ddl-auto: update

    open-in-view: false

  security:
    oauth2:
      client:
        registration:
            google:
                client-id: ${GOOGLE_CLIENT_ID}
                client-secret: ${GOOGLE_CLIENT_SECRET}
                redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:8081/login/oauth2/code/google}

  mail:
    host: ${MAIL_HOST:}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    port: ${MAIL_PORT:587}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

server:
  port: 8081
  forward-headers-strategy: framework

app:
  admin:
    email: admin@booksocial.com
    password: admin12345

  jwt:
    secret: ${APP_JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    issuer: booksocial-identity

  oauth2:
    frontend-redirect-uri: ${OAUTH_FRONTEND_REDIRECT_URI:http://localhost:4200/oauth2/callback}

  mail:
    from: ${MAIL_FROM:no-reply@booksocial.com}
    reset-base-url: ${FRONTEND_URL:http://localhost:4200}

  rate-limit:
    requests: 5
    period-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health