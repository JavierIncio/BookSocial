<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="auth-form"
>
  @if (sent()) {
  <h1 i18n="@@forgotTitleSent">Check your email</h1>
  <p
    class="info"
    i18n="@@forgotSentInfo"
  >If an account exists for that email, we sent you a link to reset your password.</p>
  <p
    class="switch"
    i18n="@@forgotBackToLogin"
  ><a routerLink="/login">Back to login</a></p>
  }
  @else {
  <h1 i18n="@@forgotTitle">Forgot password</h1>

  <label i18n="@@forgotEmailLabel">
    Email
    <input
      type="email"
      formControlName="email"
      autocomplete="email"
    >
  </label>

  @if (errorMessage()) {
  <p class="error">{{ errorMessage() }}</p>
  }

  <button
    type="submit"
    [disabled]="form.invalid || loading()"
    i18n="@@forgotSubmitButton"
  >
    {{ loading() ? 'Sending...' : 'Send reset link' }}
  </button>

  <p
    class="switch"
    i18n="@@forgotBackToLogin2"
  ><a routerLink="/login">Back to login</a></p>
  }
</form>
