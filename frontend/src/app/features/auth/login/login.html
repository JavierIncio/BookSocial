<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="auth-form"
>
  <h1>Login</h1>

  <label>
    Email
    <input
      type="email"
      formControlName="email"
      autocomplete="email"
    >
  </label>

  <label>
    Password
    <input
      type="password"
      formControlName="password"
      autocomplete="current-password"
    >
  </label>

  @if (errorMessage) {
  <p class="error">{{ errorMessage }}</p>
  }

  <button
    type="submit"
    [disabled]="form.invalid"
  >
    {{ loading ? 'Logging in...' : 'Login' }}
  </button>

  <button
    type="button"
    class="google"
    (click)="loginWithGoogle()"
  >
    Login with Google
  </button>

  <p class="switch">
    Don't have an account? <a routerLink="/register">Sign up</a>
  </p>
</form>
