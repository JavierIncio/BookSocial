<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="auth-form"
>
  <h1 i18n="@@loginTitle">Login</h1>

  <label i18n="@@loginEmailLabel">
    Email
    <input
      type="email"
      formControlName="email"
      autocomplete="email"
    >
  </label>

  <label i18n="@@loginPasswordLabel">
    Password
    <input
      type="password"
      formControlName="password"
      autocomplete="current-password"
    >
  </label>

  @if (errorMessage()) {
  <p class="error">{{ errorMessage() }}</p>
  }

  <button
    type="submit"
    [disabled]="form.invalid"
    i18n="@@loginSubmitButton"
  >
    {{ loading() ? 'Logging in...' : 'Login' }}
  </button>

  <button
    type="button"
    class="google"
    (click)="loginWithGoogle()"
    i18n="@@loginGoogleButton"
  >
    Login with Google
  </button>

  <p
    class="switch"
    i18n="@@loginSwitch"
  >
    Don't have an account? <a routerLink="/register">Sign up</a>
  </p>
</form>
