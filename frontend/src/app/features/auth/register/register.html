<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="auth-form"
>
  <h1 i18n="@@registerTitle">Create Account</h1>

  <div class="row">
    <label i18n="@@registerFirstNameLabel">
      Name
      <input
        type="text"
        formControlName="firstName"
        autocomplete="given-name"
      />
    </label>

    <label i18n="@@registerLastNameLabel">
      Last Name
      <input
        type="text"
        formControlName="lastName"
        autocomplete="family-name"
      />
    </label>
  </div>

  <label i18n="@@registerEmailLabel">
    Email
    <input
      type="email"
      formControlName="email"
      autocomplete="email"
    />
  </label>

  <label>
    <span i18n="@@registerPasswordLabel">Password</span>
    <input
      type="password"
      formControlName="password"
      autocomplete="new-password"
    />
    <small i18n="@@registerPasswordHint">Minimum 8 characters.</small>
  </label>

  <label i18n="@@registerBirthDateLabel">
    Birth Date
    <input
      type="date"
      formControlName="birthDate"
    />
  </label>

  @if (errorMessage()) {
  <p class="error">{{ errorMessage() }}</p>
  }

  <button
    type="submit"
    [disabled]="form.invalid || loading()"
    i18n="@@registerSubmitButton"
  >
    {{ loading() ? 'Creating…' : 'Create Account' }}
  </button>

  <button
    type="button"
    (click)="loginWithGoogle()"
    class="google"
    i18n="@@registerGoogleButton"
  >Continue with Google</button>

  <p
    class="switch"
    i18n="@@registerSwitch"
  >
    Already have an account? <a routerLink="/login">Sign in</a>
  </p>
</form>
