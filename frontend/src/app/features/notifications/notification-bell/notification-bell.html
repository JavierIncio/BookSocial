<div class="bell">
  <button
    type="button"
    class="bell-button"
    (click)="toggle()"
    aria-haspopup="true"
    [attr.aria-expanded]="open()"
    aria-label="Notifications"
    i18n-aria-label="@@notifBellAriaLabel"
  >
    <svg
      class="icon"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
      <path d="M13.73 21a2 2 0 0 1-3.46 0" />
    </svg>
    @if (unread() > 0) {
    <span class="badge">{{ unread() }}</span>
    }
  </button>

  @if (open()) {
  <div class="panel">
    @if (loading()) {
    <p
      class="panel-message"
      i18n="@@notifLoading"
    >Loading notifications…</p>
    }
    @else if (error()) {
    <p class="panel-message error">{{ error() }}</p>
    }
    @else if (items().length === 0) {
    <p
      class="panel-message"
      i18n="@@notifEmpty"
    >No notifications yet.</p>
    }
    @else {
    <ul class="list">
      @for (n of items(); track n.id) {
      <li class="item">
        <span class="actor">{{ actorName(n) }}</span>
        <span i18n="@@notifVerbFollowed">started following you</span>
      </li>
      }
    </ul>
    @if (unread() > 0) {
    <button
      type="button"
      class="mark-read"
      (click)="markAllAsRead()"
      i18n="@@notifMarkAllRead"
    >Mark all as read</button>
    }
    }
  </div>
  }
</div>
