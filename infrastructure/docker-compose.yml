name: booksocial

services:
  postgres:
    image: postgres:16-alpine
    container_name: booksocial-postgres
    environment:
      POSTGRES_USER: booksocial
      POSTGRES_PASSWORD: booksocial
      POSTGRES_DB: booksocial
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booksocial"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:8.0
    container_name: booksocial-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: booksocial
      MONGO_INITDB_ROOT_PASSWORD: booksocial
      MONGO_INITDB_DATABASE: booksocial
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: booksocial-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    container_name: booksocial-gateway
    ports:
      - "8080:8080"
    env_file:
      - ../gateway/.env
    environment:
      IDENTITY_SERVICE_URI: http://identity-service:8081
      USER_SERVICE_URI: http://user-service:8082
    depends_on:
      identity-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  identity-service:
    build:
      context: ..
      dockerfile: identity-service/Dockerfile
    container_name: booksocial-identity
    ports:
      - "8081:8081"
    env_file:
      - ../identity-service/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booksocial
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  user-service:
    build:
      context: ..
      dockerfile: user-service/Dockerfile
    container_name: booksocial-user
    ports:
      - "8082:8082"
    env_file:
      - ../user-service/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booksocial
      SPRING_MONGODB_URI: mongodb://booksocial:booksocial@mongodb:27017/booksocial?authSource=admin
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
  mongodb-data:
  rabbitmq-data:
